{{define "content"}}
<h1 class="h2 mb-3">SMS Logs</h1>
<script>
// Auto-refresh controller for the SMS Logs table. Polls the CURRENT url (filters + page are
// kept in the address bar by hx-push-url) and swaps only #log-table-container, so the page,
// modals and filter inputs are never disturbed. Defined as a global so it is available whether
// the page arrives via full load or a boosted navigation.
window.smsLogAutoRefresh = window.smsLogAutoRefresh || function () {
	return {
		on: localStorage.getItem("smsLogAutoRefresh") === "1",
		secs: parseInt(localStorage.getItem("smsLogAutoRefreshSecs") || "10", 10) || 10,
		timer: null,
		updated: "",
		init() {
			this.$watch("on", (v) => {
				localStorage.setItem("smsLogAutoRefresh", v ? "1" : "0");
				v ? this.start() : this.stop();
			});
			this.$watch("secs", (v) => {
				localStorage.setItem("smsLogAutoRefreshSecs", v);
				if (this.on) this.start();
			});
			if (this.on) this.start();
		},
		start() {
			this.stop();
			this.timer = setInterval(() => {
				// Self-clean if the user has navigated away from the logs page.
				var c = document.getElementById("log-table-container");
				if (!c) { this.stop(); return; }
				if (document.hidden || !window.htmx) return;
				window.htmx.ajax("GET", window.location.pathname + window.location.search, {
					target: "#log-table-container", swap: "innerHTML"
				});
			}, Math.max(3, this.secs) * 1000);
		},
		stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } }
	};
};
// Column picker for the SMS Logs table. One control drives BOTH the on-screen view and the CSV/PDF
// exports: hidden columns are removed from the table (for a clean screenshot) and excluded from the
// export "cols" parameter (to share only the selected fields). Visibility is applied via a single
// <style id="sms-col-style"> block that lives OUTSIDE #log-table-container, so it keeps applying across
// every HTMX table swap (auto-refresh, paginate, filter) with no re-binding. Choice persists in
// localStorage. Keys mirror the Go column registry (sms_logs.go); "actions" is view-only, never exported.
window.smsLogColumns = window.smsLogColumns || function () {
	var ALL = [
		{ key: "received", label: "Received" },
		{ key: "message_id", label: "Message ID" },
		{ key: "client", label: "Client" },
		{ key: "to", label: "To" },
		{ key: "from", label: "From" },
		{ key: "segments", label: "Segments" },
		{ key: "charged", label: "Charged" },
		{ key: "currency", label: "Currency" },
		{ key: "carrier", label: "Carrier" },
		{ key: "failover", label: "Failover" },
		{ key: "status", label: "Status" },
		{ key: "actions", label: "Actions" }
	];
	var KEYS = ALL.map(function (c) { return c.key; });
	var LABELS = {}; ALL.forEach(function (c) { LABELS[c.key] = c.label; });
	// actions is view-only; every other column is exportable.
	var EXPORTABLE = {}; ALL.forEach(function (c) { EXPORTABLE[c.key] = c.key !== "actions"; });
	// normalizeOrder keeps a saved order forward-compatible: known keys in their saved position, then any
	// registry key the saved order is missing (a column added later), and drops anything unrecognised.
	function normalizeOrder(saved) {
		var seen = {}, out = [];
		(Array.isArray(saved) ? saved : []).forEach(function (k) {
			if (KEYS.indexOf(k) >= 0 && !seen[k]) { seen[k] = 1; out.push(k); }
		});
		KEYS.forEach(function (k) { if (!seen[k]) out.push(k); });
		return out;
	}
	return {
		order: KEYS.slice(),
		hidden: {},
		labelOf(k) { return LABELS[k] || k; },
		init() {
			try {
				var h = JSON.parse(localStorage.getItem("smsLogHiddenCols") || "{}");
				if (h && typeof h === "object") this.hidden = h;
			} catch (e) { this.hidden = {}; }
			try {
				this.order = normalizeOrder(JSON.parse(localStorage.getItem("smsLogColOrder") || "null"));
			} catch (e) { this.order = KEYS.slice(); }
			this.apply();
		},
		visible(k) { return !this.hidden[k]; },
		toggle(k) {
			this.hidden = Object.assign({}, this.hidden, { [k]: !this.hidden[k] });
			localStorage.setItem("smsLogHiddenCols", JSON.stringify(this.hidden));
			this.applyHide();
		},
		move(i, delta) {
			var j = i + delta;
			if (j < 0 || j >= this.order.length) return;
			var o = this.order.slice();
			var t = o[i]; o[i] = o[j]; o[j] = t;
			this.order = o;
			localStorage.setItem("smsLogColOrder", JSON.stringify(this.order));
			this.reorderDOM();
		},
		reset() {
			this.hidden = {};
			this.order = KEYS.slice();
			localStorage.setItem("smsLogHiddenCols", "{}");
			localStorage.setItem("smsLogColOrder", JSON.stringify(this.order));
			this.apply();
		},
		apply() { this.applyHide(); this.reorderDOM(); },
		// applyHide writes a single <style> block outside the swapped table container, so hidden columns
		// stay hidden across auto-refresh / paging / filtering with no re-binding.
		applyHide() {
			var css = "", self = this;
			KEYS.forEach(function (k) {
				if (self.hidden[k]) css += '#log-table-container [data-col="' + k + '"]{display:none}';
			});
			var el = document.getElementById("sms-col-style");
			if (el) el.textContent = css;
		},
		// reorderDOM moves each row's cells (thead + tbody) into the chosen order. CSS `order` does not
		// apply to table cells, so we reorder the nodes; appendChild in order sequences them exactly.
		// Runs on init and after every HTMX table swap (see the root's htmx:after-swap handler).
		reorderDOM() {
			var container = document.getElementById("log-table-container");
			if (!container) return;
			var order = this.order;
			container.querySelectorAll("tr").forEach(function (tr) {
				var cells = {}, has = false;
				Array.prototype.forEach.call(tr.children, function (cell) {
					var k = cell.getAttribute("data-col");
					if (k) { cells[k] = cell; has = true; }
				});
				if (!has) return; // skip the empty-state / non-column rows
				order.forEach(function (k) { if (cells[k]) tr.appendChild(cells[k]); });
			});
		},
		exportCols() {
			var self = this;
			return this.order.filter(function (k) { return EXPORTABLE[k] && !self.hidden[k]; }).join(",");
		}
	};
};
</script>
<div class="card bg-body-tertiary border mb-3">
	<div class="card-body">
		<div class="row g-2">
			<div class="col-md-2">
				<select class="form-select form-select-sm filter-input" name="client_id">
					<option value="">All Clients</option>
					{{range .Clients}}<option value="{{.ClientID}}"{{if eq $.Filter.ClientID .ClientID}} selected{{end}}>{{.Name}}</option>{{end}}
				</select>
			</div>
			<div class="col-md-2">
				<select class="form-select form-select-sm filter-input" name="carrier_id">
					<option value="">All Carriers</option>
					{{range .Carriers}}<option value="{{.CarrierID}}"{{if eq $.Filter.CarrierID .CarrierID}} selected{{end}}>{{.Name}}</option>{{end}}
				</select>
			</div>
			<div class="col-md-2">
				<select class="form-select form-select-sm filter-input" name="routing_group_id">
					<option value="">All Routing Groups</option>
					{{range .Routing}}<option value="{{.RoutingGroupID}}"{{if eq $.Filter.RoutingGroupID .RoutingGroupID}} selected{{end}}>{{.Name}}</option>{{end}}
				</select>
			</div>
			<div class="col-md-2">
				<select class="form-select form-select-sm filter-input" name="status">
					<option value="">All Statuses</option>
					<option value="pending"{{if eq .Filter.Status "pending"}} selected{{end}}>pending</option>
					<option value="accepted"{{if eq .Filter.Status "accepted"}} selected{{end}}>accepted</option>
					<option value="sent"{{if eq .Filter.Status "sent"}} selected{{end}}>sent</option>
					<option value="delivered"{{if eq .Filter.Status "delivered"}} selected{{end}}>delivered</option>
					<option value="failed"{{if eq .Filter.Status "failed"}} selected{{end}}>failed</option>
					<option value="rejected"{{if eq .Filter.Status "rejected"}} selected{{end}}>rejected</option>
				</select>
			</div>
			<div class="col-md-2">
				<select class="form-select form-select-sm filter-input" name="failover_sequence">
					<option value="">All</option>
					<option value="0"{{if eq .Filter.FailoverSequence "0"}} selected{{end}}>Primary Only</option>
					<option value="1"{{if eq .Filter.FailoverSequence "1"}} selected{{end}}>Failover 1</option>
					<option value="2"{{if eq .Filter.FailoverSequence "2"}} selected{{end}}>Failover 2</option>
				</select>
			</div>
			<div class="col-md-2"><input type="text" class="form-control form-control-sm filter-input" name="prefix_matched" placeholder="Prefix" value="{{.Filter.PrefixMatched}}"></div>
			<div class="col-md-2"><input type="date" class="form-control form-control-sm filter-input" name="date_from" value="{{.Filter.DateFrom}}"></div>
			<div class="col-md-2"><input type="date" class="form-control form-control-sm filter-input" name="date_to" value="{{.Filter.DateTo}}"></div>
			<div class="col-md-2"><input type="number" min="1" max="200" class="form-control form-control-sm filter-input" name="page_size" value="{{.Filter.PageSize}}"></div>
			<div class="col-md-2 d-flex gap-2">
				<button class="btn btn-primary btn-sm" hx-get="/admin/sms-logs" hx-include=".filter-input" hx-target="#log-table-container" hx-push-url="true">Apply Filters</button>
				<a class="btn btn-outline-secondary btn-sm" href="/admin/sms-logs">Reset</a>
			</div>
			<div class="col-md-6 d-flex gap-2 align-items-center" x-data="smsLogColumns()" x-init="init()"
				@htmx:after-swap.document="if ($event.detail && $event.detail.target && $event.detail.target.id === 'log-table-container') reorderDOM()"
				data-csv="/admin/sms-logs/export.csv?client_id={{.Filter.ClientID}}&carrier_id={{.Filter.CarrierID}}&routing_group_id={{.Filter.RoutingGroupID}}&status={{.Filter.Status}}&failover_sequence={{.Filter.FailoverSequence}}&prefix_matched={{.Filter.PrefixMatched}}&date_from={{.Filter.DateFrom}}&date_to={{.Filter.DateTo}}"
				data-pdf="/admin/sms-logs/export.pdf?client_id={{.Filter.ClientID}}&carrier_id={{.Filter.CarrierID}}&routing_group_id={{.Filter.RoutingGroupID}}&status={{.Filter.Status}}&failover_sequence={{.Filter.FailoverSequence}}&prefix_matched={{.Filter.PrefixMatched}}&date_from={{.Filter.DateFrom}}&date_to={{.Filter.DateTo}}">
				<div class="dropdown">
					<button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">Columns</button>
					<div class="dropdown-menu p-2" style="min-width:240px">
						<div class="d-flex justify-content-between align-items-center mb-2 px-1">
							<span class="small text-secondary">Show &amp; order columns</span>
							<button type="button" class="btn btn-link btn-sm p-0" @click="reset()">Reset</button>
						</div>
						<template x-for="(k, i) in order" :key="k">
							<div class="d-flex align-items-center gap-1">
								<div class="form-check flex-grow-1 mb-0">
									<input class="form-check-input" type="checkbox" :id="'col-' + k" :checked="visible(k)" @change="toggle(k)">
									<label class="form-check-label small" :for="'col-' + k" x-text="labelOf(k)"></label>
								</div>
								<button type="button" class="btn btn-sm btn-link p-0 px-1 text-secondary" @click="move(i, -1)" :disabled="i === 0" title="Move up">&uarr;</button>
								<button type="button" class="btn btn-sm btn-link p-0 px-1 text-secondary" @click="move(i, 1)" :disabled="i === order.length - 1" title="Move down">&darr;</button>
							</div>
						</template>
					</div>
				</div>
				<a class="btn btn-outline-success btn-sm" hx-boost="false" download :href="$root.dataset.csv + '&cols=' + exportCols()">Export CSV</a>
				<div class="dropdown">
					<button class="btn btn-outline-danger btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Export PDF</button>
					<ul class="dropdown-menu">
						<li><a class="dropdown-item" hx-boost="false" download :href="$root.dataset.pdf + '&cols=' + exportCols() + '&orientation=landscape'">Landscape</a></li>
						<li><a class="dropdown-item" hx-boost="false" download :href="$root.dataset.pdf + '&cols=' + exportCols() + '&orientation=portrait'">Portrait</a></li>
					</ul>
				</div>
			</div>
			<div class="col-md-4 d-flex align-items-center gap-2 ms-auto justify-content-end"
				x-data="smsLogAutoRefresh()"
				@htmx:after-swap.document="if ($event.detail && $event.detail.target && $event.detail.target.id === 'log-table-container') updated = new Date().toLocaleTimeString()">
				<div class="form-check form-switch mb-0">
					<input class="form-check-input" type="checkbox" role="switch" id="sms-auto-refresh" x-model="on">
					<label class="form-check-label small" for="sms-auto-refresh">Auto-refresh</label>
				</div>
				<select class="form-select form-select-sm" style="width:auto" x-model.number="secs" x-show="on" x-cloak>
					<option value="5">5s</option>
					<option value="10">10s</option>
					<option value="30">30s</option>
					<option value="60">60s</option>
				</select>
				<span class="small text-secondary" x-show="updated" x-cloak x-text="'updated ' + updated"></span>
			</div>
		</div>
	</div>
</div>
<style id="sms-col-style"></style>
<style>
/* Message ID: show the full value when the viewport has room, ellipsize only when cramped (full id
   stays available in the cell tooltip). clamp() adapts the cap to the available width. */
#log-table-container .msgid-cell { max-width: clamp(12ch, 16vw, 36ch); font-family: var(--bs-font-monospace); }
</style>
<div id="log-table-container">{{template "sms_logs_table" .}}</div>
{{end}}
